name: Kittygram

on:
  push:
    branches:
      - main
      - first
  workflow_dispatch:
  workflow_call:
    inputs:
      vm_public_ip:
        description: Статический IP из Terraform.
        required: false
        type: string
jobs:
  resolve_deployment_target:
    name: Resolve static VM address
    runs-on: ubuntu-latest
    outputs:
      vm_public_ip: ${{ steps.vm_public_ip.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # После apply IP передаётся напрямую. При push он читается из state.
      - name: Set up Terraform
        if: ${{ inputs.vm_public_ip == '' }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Initialise Terraform backend
        if: ${{ inputs.vm_public_ip == '' }}
        working-directory: infra
        env:
          TF_CLI_CONFIG_FILE: ${{ github.workspace }}/infra/terraformrc
          TF_IN_AUTOMATION: "true"
          TF_INPUT: "false"
        run: >-
          terraform init -reconfigure
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=${{ secrets.TF_STATE_KEY }}"
          -backend-config="access_key=${{ secrets.YC_S3_ACCESS_KEY }}"
          -backend-config="secret_key=${{ secrets.YC_S3_SECRET_KEY }}"

      - name: Select deployment IP
        id: vm_public_ip
        working-directory: infra
        env:
          REQUESTED_VM_PUBLIC_IP: ${{ inputs.vm_public_ip }}
        run: |
          if [ -n "$REQUESTED_VM_PUBLIC_IP" ]; then
            vm_public_ip="$REQUESTED_VM_PUBLIC_IP"
          else
            vm_public_ip="$(terraform output -raw vm_public_ip)"
          fi
          test -n "$vm_public_ip"
          echo "value=$vm_public_ip" >> "$GITHUB_OUTPUT"

  tests:
    name: Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: kittygram
          POSTGRES_USER: kittygram_user
          POSTGRES_PASSWORD: kittygram_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: kittygram
      POSTGRES_USER: kittygram_user
      POSTGRES_PASSWORD: kittygram_password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DEBUG: 'True'
      CI: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8==6.0.0 flake8-isort==6.0.0
          pip install -r ./backend/requirements.txt
      - name: Test with flake8 and django tests
        env:
          POSTGRES_USER: kittygram
          POSTGRES_PASSWORD: kittygram_password
          POSTGRES_DB: kittygram
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
        run: |
          python -m flake8 backend/
          cd backend/
          python manage.py test


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false

  build_and_push:
    name: Build and push images
    needs: tests
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_frontend:latest

      - name: Build and push gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_gateway:latest

  deploy:
    name: Deploy to server
    needs:
      - build_and_push
      - resolve_deployment_target
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy configuration to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.resolve_deployment_target.outputs.vm_public_ip }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.production.yml,nginx/nginx.conf"
          target: "/home/${{ secrets.SSH_USER }}/kittygram"

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v0.1.10
        env:
          DEPLOY_ENV_FILE: ${{ secrets.ENV_FILE }}
          VM_PUBLIC_IP: ${{ needs.resolve_deployment_target.outputs.vm_public_ip }}
        with:
          host: ${{ needs.resolve_deployment_target.outputs.vm_public_ip }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_ENV_FILE,VM_PUBLIC_IP
          script: |
            set -eu
            for attempt in $(seq 1 30); do
              if test -f /var/lib/cloud/instance/kittygram-ready; then
                break
              fi
              sleep 10
            done
            test -f /var/lib/cloud/instance/kittygram-ready
            cd /home/${{ secrets.SSH_USER }}/kittygram
            # Удаляем старый ALLOWED_HOSTS и добавляем IP из Terraform.
            printf '%s\n' "$DEPLOY_ENV_FILE" | sed '/^[[:space:]]*ALLOWED_HOSTS[[:space:]]*=/d' > .env
            printf 'ALLOWED_HOSTS=%s,localhost,127.0.0.1\n' "$VM_PUBLIC_IP" >> .env
            sudo docker compose -f docker-compose.production.yml pull
            sudo docker compose -f docker-compose.production.yml up -d --remove-orphans
            sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py migrate --noinput
            sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --noinput

  post_deploy_tests:
    name: Autotests
    # Прогоняем тесты из директории tests в корне проекта
    runs-on: ubuntu-latest
    needs:
      - deploy
      - resolve_deployment_target
    steps:
    # Копируем код проекта:
    - name: Check out code
      uses: actions/checkout@v4
    # Устанавливаем Python с помощью action:
    - name: Set up Python
      uses: actions/setup-python@v5
    # В action setup-python@v4 передаём параметр — версию Python:
      with:
        python-version: 3.9
    # Обновляем pip, устанавливаем pytest и зависимости
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest
    - name: Set deployed service details
      run: |
        cat > tests.yml <<EOF
        repo_owner: ${{ github.repository_owner }}
        kittygram_domain: http://${{ needs.resolve_deployment_target.outputs.vm_public_ip }}
        dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
        EOF
    - name: Run tests
      run: |
        pytest -c tests.yml tests
