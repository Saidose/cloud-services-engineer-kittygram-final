version: "3.8"

volumes:
  static:
  media:
  pg_data:

services:
  postgres:
    image: postgres:13
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: ${DOCKERHUB_USERNAME}/kittygram_backend
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - static:/app/collected_static
      - media:/app/media
    restart: always

  frontend:
    image: ${DOCKERHUB_USERNAME}/kittygram_frontend
    depends_on:
      - backend
    command: >
      sh -c "cp -r /app/build/. /static/ &&
             npx -y http-server -p 9000 /app/build"
    volumes:
      - static:/static
    restart: always

  gateway:
    image: ${DOCKERHUB_USERNAME}/kittygram_gateway
    ports:
      - "9000:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - static:/static
      - media:/media
    restart: always
