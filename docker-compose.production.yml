version: '3'

volumes:
  pg_data:
  static:
  media:

networks:
  internal_network:
    driver: bridge

services:
  postgres:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal_network

  backend:
    image: gelderdasgeld/kittygram_backend:latest
    restart: always
    env_file: .env
    volumes:
      - static:/backend_static
      - media:/app/media
    depends_on:
      - postgres
    networks:
      - internal_network

  frontend:
    image: gelderdasgeld/kittygram_frontend:latest
    env_file: .env
    volumes:
      - static:/frontend_static
    networks:
      - internal_network

  nginx:
    image: gelderdasgeld/kittygram_gateway:latest
    env_file: .env
    ports:
      - "80:80"
    volumes:
      - static:/var/html/static
      - media:/var/html/media
    depends_on:
      - backend
      - frontend
    networks:
      - internal_network
