server {
    listen 80;
    index index.html;
    server_tokens off;

    location ~ ^/(api|admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    location /media/ {
        alias /var/html/media/;
    }

    location ~ ^/static/(admin|rest_framework)/(.*)$ {
        alias /var/html/$1/$2;
    }

    location /static/ {
        root /var/html;
        try_files $uri =404;
    }

    location / {
        root /var/html;
        try_files $uri $uri/ /index.html;
    }
}
